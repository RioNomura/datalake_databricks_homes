name: terraform

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - "scripts/notion_sync.py"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - "scripts/notion_sync.py"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  pull-requests: write

# apply が同時に走らないようにする
concurrency:
  group: terraform
  cancel-in-progress: false

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
  TF_IN_AUTOMATION: "true"

defaults:
  run:
    working-directory: infra/terraform

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        run: terraform plan -input=false -no-color -out=tfplan | tee plan.txt

      - name: Notion 同期のプレビュー
        run: |
          terraform show -json tfplan > plan.json
          echo '{}' > state.json
          python3 "$GITHUB_WORKSPACE/scripts/notion_sync.py" --plan plan.json --state state.json --dry-run

      - name: plan の結果を PR にコメント
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'infra/terraform/plan.txt';
            const plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').slice(-60000) : 'plan が実行されませんでした。ログを確認してください。';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: "### terraform plan\n```\n" + plan + "\n```"
            });

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false

      - name: terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: terraform apply
        run: |
          terraform show -json tfplan > plan.json
          terraform apply -input=false -no-color tfplan

      - name: Notion のリソース台帳を更新
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          terraform show -json > state.json
          python3 "$GITHUB_WORKSPACE/scripts/notion_sync.py" --plan plan.json --state state.json
